name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          if [ ! -f settings.gradle ]; then
            Z=$(ls *.zip | head -n 1)
            unzip -o "$Z" -d .
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ScreenRefresh.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenRefresh-APK
          path: ScreenRefresh.apk

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Screen Refresh v1.${{ github.run_number }}
          files: ScreenRefresh.apk
          make_latest: true
